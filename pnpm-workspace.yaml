packages:
    - packages/*

saveExact: true

allowBuilds:
    "@parcel/watcher": true
    electron: true
    electron-winstaller: true
    esbuild: true
    husky: true
    sharp: true
    unrs-resolver: true

catalog:
    "@types/node": 26.6.3
    "@eslint/js": 10.0.1
    "@next/eslint-plugin-next": 16.3.8
    eslint: 10.11.0
    eslint-import-resolver-typescript: 4.4.5
    eslint-plugin-import-x: 4.17.1
    http-server: 14.1.1
    jsdom: 30.1.1
    oxfmt: 0.71.0
    typedoc: 0.28.20
    typedoc-github-theme: 0.4.0
    typedoc-plugin-missing-exports: 4.1.4
    typescript: 6.0.3
    typescript-eslint: 8.71.0
    vite: 8.3.2
    vitest: 5.0.3
    zod: 4.6.5
