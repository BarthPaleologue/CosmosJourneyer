    electron: true
    electron-winstaller: true
    esbuild: true
    husky: true
    sharp: true
    unrs-resolver: true

catalog:
    "@types/node": 26.6.6
    "@eslint/js": 10.0.1
    "@next/eslint-plugin-next": 16.4.6
    "@typescript-eslint/rule-tester": 8.73.0
    "@typescript-eslint/utils": 8.73.0
    eslint: 10.15.0
    eslint-import-resolver-typescript: 4.4.5
    eslint-plugin-import-x: 4.18.1
    eslint-plugin-jsdoc: 65.5.0
    http-server: 14.1.1
    jiti: 2.7.0
    jsdom: 30.1.3
    oxfmt: 0.79.0
    typedoc: 0.28.20
    typedoc-github-theme: 0.4.0
    typedoc-plugin-missing-exports: 4.1.4
    typescript: 6.0.3
    typescript-eslint: 8.73.0
    vite: 8.3.8
    vitest: 5.1.1
    zod: 4.6.7
