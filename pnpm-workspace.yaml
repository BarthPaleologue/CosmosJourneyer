    http-server: ^14.1.1
    jsdom: ^30.0.1
    oxfmt: ^0.67.0
    typedoc: ^0.28.20
    typedoc-github-theme: ^0.4.0
    typedoc-plugin-missing-exports: ^4.1.4
    typescript: ^6.0.3
    typescript-eslint: ^8.70.0
    vite: ^8.3.0
    vitest: ^5.0.1
    zod: ^4.6.2
