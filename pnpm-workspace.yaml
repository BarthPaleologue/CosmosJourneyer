    electron: true
    electron-winstaller: true
    esbuild: true
    husky: true
    sharp: true
    unrs-resolver: true

catalog:
    "@eslint/js": ^10.0.1
    "@next/eslint-plugin-next": ^16.3.3
    eslint: ^10.9.1
    eslint-import-resolver-typescript: ^4.4.5
    eslint-plugin-import-x: ^4.17.1
    http-server: ^14.1.1
    jsdom: ^30.0.1
    oxfmt: ^0.65.0
    typedoc: ^0.28.20
    typedoc-github-theme: ^0.4.0
    typedoc-plugin-missing-exports: ^4.1.4
    typescript: ^6.0.3
    typescript-eslint: ^8.68.0
    vite: ^8.2.2
    vitest: ^4.1.11
    zod: ^4.5.4
