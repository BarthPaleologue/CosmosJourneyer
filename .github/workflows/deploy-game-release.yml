name: Deploy Game Release

on:
    workflow_dispatch:
        inputs:
            sha:
                description: "Full commit SHA to release; leave empty to use main without repeating full CI"
                required: false
                type: string
            dry_run:
                description: "Run deployment rsync commands without changing the VPS"
                required: true
                type: boolean
                default: true

concurrency:
    group: production-game-release
    cancel-in-progress: false

jobs:
    prepare-release:
        name: Prepare release
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: read
        timeout-minutes: 5
        runs-on: ubuntu-latest
        outputs:
            source_sha: ${{ steps.source.outputs.commit }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Checkout release source
              id: source
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.sha || github.sha }}
                  lfs: false

            - name: Read and validate release version
              id: version
              env:
                  SOURCE_SHA: ${{ steps.source.outputs.commit }}
                  INPUT_SHA: ${{ inputs.sha }}
              run: |
                  if [[ -n "$INPUT_SHA" && "${INPUT_SHA,,}" != "$SOURCE_SHA" ]]; then
                      echo "sha must be the full commit SHA" >&2
                      exit 1
                  fi
                  VERSION=$(jq -er .version packages/game/package.json)
                  if ! jq -es --arg version "$VERSION" 'all(.[]; .version == $version)' package.json packages/desktop-electron/package.json >/dev/null; then
                      echo "Root, game and Electron versions must match" >&2
                      exit 1
                  fi
                  TAG_REF="refs/tags/v$VERSION"
                  git check-ref-format "$TAG_REF"
                  EXISTING_TAG=$(git ls-remote --tags origin "$TAG_REF")
                  if [[ -n "$EXISTING_TAG" ]]; then
                      git fetch --quiet --no-tags origin "$TAG_REF"
                      if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$SOURCE_SHA" ]]; then
                          echo "Tag v$VERSION already identifies another commit; bump the version" >&2
                          exit 1
                      fi
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  printf 'Release **v%s** — `%s`\n' "$VERSION" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

    validate-source:
        name: Validate release source
        needs: prepare-release
        if: inputs.sha != ''
        permissions:
            contents: read
            pull-requests: read
        uses: ./.github/workflows/ci-checks.yml
        with:
            source_sha: ${{ needs.prepare-release.outputs.source_sha }}

    build-game:
        name: Build game artifact
        needs: [prepare-release, validate-source]
        if: ${{ !cancelled() && needs.prepare-release.result == 'success' && (inputs.sha == '' || needs.validate-source.result == 'success') }}
        permissions:
            contents: read
        timeout-minutes: 20
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.prepare-release.outputs.source_sha }}
                  lfs: false

            - name: Checkout release tooling
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  lfs: false
                  path: .workflow-tools
                  sparse-checkout: .github/actions/setup-lfs

            - name: Setup Git LFS assets
              uses: ./.workflow-tools/.github/actions/setup-lfs

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Setup wasm-pack
              uses: taiki-e/install-action@v2.87.29
              with:
                  tool: wasm-pack

            - name: Build game artifact
              run: pnpm --filter @cosmos-journeyer/game... build

            - name: Upload game artifact
              uses: actions/upload-artifact@v7
              with:
                  name: game-dist
                  path: packages/game/dist

    build-electron:
        name: Build Electron (${{ matrix.os }})
        needs: [prepare-release, validate-source]
        if: ${{ !cancelled() && needs.prepare-release.result == 'success' && (inputs.sha == '' || needs.validate-source.result == 'success') }}
        permissions:
            contents: read
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                    - os: ubuntu-latest
                    - os: windows-latest

        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.prepare-release.outputs.source_sha }}
                  lfs: false

            - name: Checkout release tooling
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  lfs: false
                  path: .workflow-tools
                  sparse-checkout: .github/actions/setup-lfs

            - name: Setup Git LFS assets
              uses: ./.workflow-tools/.github/actions/setup-lfs

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Electron runtime
              shell: bash
              run: node "$(echo node_modules/.pnpm/electron@*/node_modules/electron/install.js)"

            - name: Build desktop packages
              run: pnpm --filter @cosmos-journeyer/desktop-electron package

            - name: Upload desktop artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: electron-${{ matrix.os }}
                  path: packages/desktop-electron/release/*

    deploy-game:
        name: Deploy game to VPS
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.prepare-release.result == 'success' && needs.build-game.result == 'success' && needs.build-electron.result == 'success' }}
        needs:
            - prepare-release
            - build-game
            - build-electron
        permissions:
            contents: read
        timeout-minutes: 20
        runs-on: ubuntu-latest
        environment:
            name: production
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  lfs: false

            - name: Download game artifact
              uses: actions/download-artifact@v8
              with:
                  name: game-dist
                  path: packages/game/dist

            - name: Configure known hosts
              env:
                  VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$VPS_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

            - name: Configure SSH agent
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

            - name: Deploy game artifact to VPS
              env:
                  DEPLOY_DRY_RUN: ${{ inputs.dry_run }}
                  RELEASE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
                  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || 22 }}
                  VPS_GAME_PATH: ${{ secrets.VPS_GAME_PATH }}
              run: bash ./scripts/deploy-game-vps.sh

    publish-electron:
        name: Create draft GitHub release
        if: ${{ !cancelled() && !inputs.dry_run && needs.build-electron.result == 'success' && needs.deploy-game.result == 'success' }}
        needs:
            - prepare-release
            - build-electron
            - deploy-game
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Download desktop artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: electron-*
                  merge-multiple: true
                  path: release-assets

            - name: Create draft release
              uses: softprops/action-gh-release@v3
              with:
                  draft: true
                  tag_name: v${{ needs.prepare-release.outputs.version }}
                  target_commitish: ${{ needs.prepare-release.outputs.source_sha }}
                  name: Cosmos Journeyer v${{ needs.prepare-release.outputs.version }}
                  body: |
                      The new version of Cosmos Journeyer is online at https://cosmosjourneyer.com/
                      This draft release contains Electron desktop builds.

                      **Deployed commit:** ${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare-release.outputs.source_sha }}
                  files: release-assets/*
                  fail_on_unmatched_files: true
