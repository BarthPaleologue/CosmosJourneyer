name: Production infrastructure

on:
    pull_request:
        branches: [main]
        paths:
            - ".github/workflows/production-infrastructure.yml"
            - "infra/production-vps/**"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: production-infrastructure-${{ github.head_ref || github.ref_name || github.run_id }}
    cancel-in-progress: true

jobs:
    validate:
        name: Validate Ansible playbook
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Use Python 3.13
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install pinned Ansible tooling
              run: python -m pip install ansible-core==2.19.12 ansible-lint==26.8.0

            - name: Install pinned Ansible collections
              working-directory: infra/production-vps
              run: ansible-galaxy collection install --requirements-file requirements.yml

            - name: Validate playbook syntax
              working-directory: infra/production-vps
              run: ansible-playbook site.yml --syntax-check

            - name: Lint playbook
              working-directory: infra/production-vps
              run: ansible-lint site.yml
